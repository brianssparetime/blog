[build]
  command = "command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh && uv venv .venv && uv pip install -r requirements.txt && .venv/bin/python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
