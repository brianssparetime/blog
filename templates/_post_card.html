<div class="post-card">
  {% if post.image %}
  <div class="post-card-img">
    <a href="/{{ post.output_dir }}/"><img src="/{{ post.output_dir }}/{{ post.thumbnail }}" alt="{{ post.title }}"{% if post.thumb_width %} width="{{ post.thumb_width }}" height="{{ post.thumb_height }}"{% endif %} loading="lazy"></a>
  </div>
  {% endif %}
  <div class="post-card-body">
    <a href="/{{ post.output_dir }}/">
      <h3 class="heading">{{ post.title }}</h3>
    </a>
    <p><i>{{ post.date | format_date }}</i></p>
    {% if post.description %}<p>{{ post.description }}</p>{% endif %}
    {% if post.tags %}
    <p class="tags">
      {% for tag in post.tags %}
      <span class="tag"><a href="/tags/{{ tag }}/">{{ tag }}</a></span>
      {% endfor %}
    </p>
    {% endif %}
  </div>
</div>
