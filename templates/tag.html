{% extends "base.html" %}
{% block title %}{{ tag }} - BST blog{% endblock %}
{% block meta_description %}<meta name="description" content="Posts tagged {{ tag }}">{% endblock %}
{% block og_tags %}
<meta property="og:title" content="{{ tag }} - {{ site.title }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}/tags/{{ tag }}/">
<meta property="og:description" content="Posts tagged {{ tag }}">
{% endblock %}
{% block content %}
<div class="posts">
  <h2>Posts for Tag: {{ tag }}</h2>

  <div class="post-grid">
    {% for post in posts %}
    {% include "_post_card.html" %}
    {% endfor %}
  </div>
</div>
{% endblock %}
